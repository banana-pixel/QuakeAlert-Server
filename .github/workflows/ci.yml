name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: python3 -m unittest test_integration.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build report-server and bridge
        run: |
          docker compose build report-server bridge
