version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto
    container_name: quake-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./config/pwfile:/mosquitto/config/pwfile
      - ./config/certs:/mosquitto/config/certs:ro
      - mosquitto_data:/mosquitto/data

  ntfy:
    image: binwiederhier/ntfy
    container_name: quake-ntfy
    restart: unless-stopped
    command: serve
    environment:
      - NTFY_BASE_URL=https://quakealert.bananapixel.my.id
      - NTFY_LISTEN_HTTP=:80
      - NTFY_BEHIND_PROXY=true
      - NTFY_FIREBASE_KEY_FILE=/etc/ntfy/firebase-key.json
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_lib:/var/lib/ntfy
      - ./config/firebase-key.json:/etc/ntfy/firebase-key.json:ro
    ports:
      - "8080:80"

  # --- LAYANAN BARU: WEB SERVER UNTUK LAPORAN ---
  report-server:
    build: .
    container_name: quake-report
    restart: unless-stopped
    command: sh -c "python -c 'import server; server.init_db()' && gunicorn -w 4 -b 0.0.0.0:5000 server:app"
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data  # Menyimpan database agar tidak hilang
    ports:
      - "127.0.0.1:5000:5000"  # Expose ke host agar Nginx bisa akses
    healthcheck:
      # Uses Python stdlib (no curl required). See RECOVERY.md section 5.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bridge:
    build: .
    container_name: quake-bridge
    restart: unless-stopped
    depends_on:
      - mosquitto
      - ntfy
      - report-server
    env_file:
      - .env
    environment:
      - MQTT_BROKER=mosquitto
      # Override endpoint laporan agar mengarah ke container report-server (internal docker)
      - REPORT_ENDPOINT=http://report-server:5000/laporan

  chat-service:
    build: ./chat-server
    ports:
      - "3000:3000"
    restart: always
    environment:
      - CORS_ORIGIN=https://quakealert.bananapixel.my.id

volumes:
  mosquitto_data:
  ntfy_cache:
  ntfy_lib:
  sqlite_data:
